<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151D20">
<title>Fit</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Karla:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<main id="main">
  <section id="view-week" class="view"></section>
  <section id="view-list" class="view" hidden></section>
  <section id="view-detail" class="view" hidden></section>
  <section id="view-import" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
</main>

<nav id="nav">
  <button data-go="week"     aria-pressed="true">Week</button>
  <button data-go="list"     aria-pressed="false">Log</button>
  <button data-go="import"   aria-pressed="false" class="add">Add</button>
  <button data-go="settings" aria-pressed="false">Setup</button>
</nav>

<script src="js/calc.js"></script>
<script src="js/model.js"></script>
<script src="js/store.js"></script>
<script src="js/parse.js"></script>
<script src="js/ui.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
