<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151D20">
<title>Groundwork</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Karla:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header id="worlds">
  <button data-world="run"  aria-pressed="true">Running</button>
  <button data-world="hike" aria-pressed="false">Hiking</button>
</header>

<main id="main">
  <section id="view-home"     class="view"></section>
  <section id="view-detail"   class="view" hidden></section>
  <section id="view-import"   class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
</main>

<button id="fab" aria-label="Add an activity">+</button>

<script src="calc.js"></script>
<script src="store.js"></script>
<script src="parse.js"></script>
<script src="ui.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
